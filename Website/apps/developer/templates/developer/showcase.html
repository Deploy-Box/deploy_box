{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="bg-zinc-950 text-white min-h-screen">
  <section class="container mx-auto px-4 py-24">
    <div class="max-w-5xl">
      <p class="text-emerald-400 font-mono text-sm uppercase tracking-[0.3em] mb-4">Developer showcase</p>
      <h1 class="text-4xl md:text-6xl font-bold tracking-tight mb-4">@{{ username }}'s work</h1>
      <p class="text-zinc-400 text-lg max-w-2xl mb-10">
        Featured projects, screenshots, and delivery highlights will live on this page.
      </p>

      <div class="grid gap-6 md:grid-cols-3">
        <div class="aspect-[4/3] rounded-xl border border-zinc-800 bg-zinc-900 p-6 flex items-end">
          <span class="text-zinc-500">Project one</span>
        </div>
        <div class="aspect-[4/3] rounded-xl border border-zinc-800 bg-zinc-900 p-6 flex items-end">
          <span class="text-zinc-500">Project two</span>
        </div>
        <div class="aspect-[4/3] rounded-xl border border-zinc-800 bg-zinc-900 p-6 flex items-end">
          <span class="text-zinc-500">Project three</span>
        </div>
      </div>
    </div>
  </section>
</div>
{% endblock %}
